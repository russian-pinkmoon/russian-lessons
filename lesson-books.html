    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Урок русского для корейцев — Книги</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* ===== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #E8EDF2;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            -webkit-tap-highlight-color: transparent;
        }
        .container {
            max-width: 700px;
            width: 100%;
            background: #FFFFFF;
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(34, 56, 75, 0.10);
            padding: 24px 20px 20px;
            position: relative;
        }
        h1 {
            font-size: 22px;
            font-weight: 600;
            color: #22384B;
            text-align: center;
            margin-bottom: 2px;
            letter-spacing: 0.3px;
        }
        .subtitle {
            text-align: center;
            color: #7A8A9A;
            font-size: 12px;
            margin-bottom: 20px;
            border-bottom: 1px solid #D0D9E0;
            padding-bottom: 10px;
        }
        .step-indicator {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            gap: 6px;
        }
        .step-dot {
            flex: 1;
            height: 6px;
            border-radius: 4px;
            background: #D0D9E0;
            transition: background 0.3s;
        }
        .step-dot.active {
            background: #2C5A7A;
        }
        .step-dot.done {
            background: #6A8CA8;
        }
        .page {
            display: none;
            animation: fade 0.25s ease;
        }
        .page.active {
            display: block;
        }
        @keyframes fade {
            0% { opacity: 0.4; transform: translateY(6px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* ===== КАРТОЧКИ (общие) ===== */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 14px;
            margin: 16px 0 20px;
        }
        .card {
            background: #FFFFFF;
            border-radius: 20px;
            padding: 12px 8px 10px;
            text-align: center;
            box-shadow: 0 4px 12px rgba(34, 56, 75, 0.06);
            border: 1px solid #D0D9E0;
            transition: 0.2s;
        }
        .card-img {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 16px;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            overflow: hidden;
        }
        .card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 16px;
        }
        .card-ru {
            font-weight: 600;
            color: #22384B;
            font-size: 16px;
        }
        .card-ko {
            font-size: 15px;
            color: #5A7A92;
            margin-top: 2px;
            font-weight: 400;
        }

        /* ===== КАРТОЧКА ДЛЯ ЗАПОМИНАНИЯ (флеш) ===== */
        .card-memory {
            background: #FFFFFF;
            border-radius: 24px;
            padding: 20px 16px 18px;
            text-align: center;
            border: 2px solid #D0D9E0;
            margin: 10px 0 16px;
            cursor: pointer;
            transition: 0.2s;
            user-select: none;
        }
        .card-memory:hover {
            background: #F5F8FA;
        }
        .card-memory .card-img {
            max-width: 200px;
            margin: 0 auto 12px;
        }
        .card-memory .memory-ru {
            font-size: 20px;
            font-weight: 600;
            color: #22384B;
            margin-top: 10px;
            padding: 8px;
            background: #E8EDF2;
            border-radius: 12px;
            display: none;
        }
        .card-memory .memory-ru.show {
            display: block;
        }
        .card-memory .hint {
            font-size: 14px;
            color: #5A7A92;
            margin-top: 8px;
        }
        /* Состояние "завершено" – без обводки и фона */
        .card-memory.finished {
            border: none;
            background: transparent;
            cursor: default;
            padding: 0;
        }
        .card-memory.finished:hover {
            background: transparent;
        }

        /* ===== КНОПКИ с переменными для фона ===== */
        .btn, .btn-remember, .test-opt, .select-opt, .about-restart-btn, .nav-bar .btn {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            outline: none;
            box-shadow: none;
            user-select: none;
            transition: transform 0.15s, background 0.15s;
        }
        .btn {
            --btn-bg: #D0D9E0;
            background: var(--btn-bg);
            border: none;
            padding: 12px 28px;
            border-radius: 40px;
            font-size: 17px;
            font-weight: 500;
            cursor: pointer;
            color: #22384B;
            min-width: 100px;
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn:focus, .btn:focus-visible {
            background: var(--btn-bg);
            outline: none;
        }
        .btn-primary {
            --btn-bg: #2C5A7A;
            color: white;
        }
        .btn-primary:hover {
            background: #1F4660;
        }
        .btn-success {
            --btn-bg: #2C5A7A;
            color: white;
        }
        .btn-success:hover {
            background: #1F4660;
        }
        .btn-danger {
            --btn-bg: #D0D9E0;
            color: #22384B;
        }
        .btn-danger:hover {
            background: #BEC8D2;
        }
        .btn:disabled {
            opacity: 0.4;
            pointer-events: none;
            filter: grayscale(0.5);
        }

        .btn-remember {
            --btn-bg: #2C5A7A;
            background: var(--btn-bg);
            color: white;
            padding: 12px 32px;
            font-size: 18px;
            border-radius: 40px;
            border: none;
            cursor: pointer;
            display: inline-block;
            margin: 6px 0 14px;
        }
        .btn-remember:active {
            transform: scale(0.96);
        }
        .btn-remember:focus, .btn-remember:focus-visible {
            background: var(--btn-bg);
            outline: none;
        }
        .btn-remember:hover {
            background: #1F4660;
        }
        .btn-remember:disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        .memory-buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-top: 14px;
            flex-wrap: wrap;
            transition: opacity 0.3s;
        }
        .memory-buttons.hidden {
            display: none;
        }

        /* ===== ЗАДАНИЕ "ВЫБЕРИ КОРЕЙСКИЙ" ===== */
        .select-card {
            background: #FFFFFF;
            border-radius: 24px;
            padding: 20px 16px;
            text-align: center;
            border: 2px solid #D0D9E0;
            margin: 10px 0 16px;
        }
        .select-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 14px;
        }
        .select-opt {
            --btn-bg: white;
            background: var(--btn-bg);
            border: 2px solid #D0D9E0;
            border-radius: 16px;
            padding: 12px 8px;
            font-size: 15px;
            cursor: pointer;
            color: #22384B;
        }
        .select-opt:active {
            transform: scale(0.96);
        }
        .select-opt:focus, .select-opt:focus-visible {
            background: var(--btn-bg);
            outline: none;
        }
        .select-opt:hover {
            background: #F5F8FA;
        }
        .select-opt.correct {
            border-color: #2C5A7A;
            background: #E8EDF2;
        }
        .select-opt.wrong {
            border-color: #D95C5C !important;
            background: #FFEAEA !important;
            animation: shake 0.3s ease-in-out;
        }
        .select-opt:disabled {
            cursor: default;
            opacity: 0.8;
        }

        /* ===== ТАБЛИЦА 3×4 ===== */
        .grid-3x4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin: 16px 0 20px;
        }
        .grid-cell {
            background: #FFFFFF;
            border: 2px solid #D0D9E0;
            border-radius: 16px;
            padding: 14px 6px;
            text-align: center;
            font-size: 15px;
            cursor: pointer;
            transition: 0.15s;
            user-select: none;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            word-break: break-word;
            color: #22384B;
        }
        .grid-cell.selected {
            border-color: #2C5A7A;
            background: #F5F8FA;
            box-shadow: 0 0 0 3px rgba(44,90,122,0.2);
        }
        .grid-cell.matched {
            border-color: #6A8CA8;
            background: #E8EDF2;
            pointer-events: none;
            opacity: 0.7;
        }
        .grid-cell.wrong {
            border-color: #D95C5C !important;
            background: #FFEAEA !important;
            animation: shake 0.3s ease-in-out;
        }
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            50% { transform: translateX(8px); }
            75% { transform: translateX(-4px); }
            100% { transform: translateX(0); }
        }

        /* ===== ТЕСТ (4 варианта) ===== */
        .test-card {
            background: #FFFFFF;
            border-radius: 24px;
            padding: 20px 16px;
            text-align: center;
            border: 2px solid #D0D9E0;
            margin: 10px 0 16px;
        }
        .test-card .card-img {
            max-width: 180px;
            margin: 0 auto 12px;
        }
        .test-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 14px;
        }
        .test-opt {
            --btn-bg: white;
            background: var(--btn-bg);
            border: 2px solid #D0D9E0;
            border-radius: 16px;
            padding: 12px 8px;
            font-size: 15px;
            cursor: pointer;
            color: #22384B;
        }
        .test-opt:active {
            transform: scale(0.96);
        }
        .test-opt:focus, .test-opt:focus-visible {
            background: var(--btn-bg);
            outline: none;
        }
        .test-opt:hover {
            background: #F5F8FA;
        }
        .test-opt.correct {
            border-color: #2C5A7A;
            background: #E8EDF2;
        }
        .test-opt.wrong {
            border-color: #D95C5C !important;
            background: #FFEAEA !important;
            animation: shake 0.3s ease-in-out;
        }
        .test-opt:disabled {
            cursor: default;
            opacity: 0.8;
        }

        /* ===== ПРОГРЕСС-БАР (счётчики) ===== */
        .progress-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
            color: #22384B;
            background: #E8EDF2;
            padding: 8px 16px;
            border-radius: 40px;
            margin: 8px 0 12px;
            flex-wrap: wrap;
            gap: 6px 12px;
        }
        .progress-row .highlight {
            color: #2C5A7A;
            font-weight: 600;
        }
        .progress-row .progress-text {
            display: inline-block;
        }

        /* ===== НАВИГАЦИЯ ВНИЗУ ===== */
        .nav-bar {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-top: 22px;
            padding-top: 14px;
            border-top: 2px solid #D0D9E0;
            flex-wrap: wrap;
        }
        .nav-bar .btn {
            --btn-bg: #D0D9E0;
            background: var(--btn-bg);
            flex: 1;
            min-width: 80px;
            padding: 10px 12px;
            font-size: 15px;
            text-align: center;
        }
        .nav-bar .btn:active {
            transform: scale(0.96);
        }
        .nav-bar .btn:focus, .nav-bar .btn:focus-visible {
            background: var(--btn-bg);
            outline: none;
        }
        .nav-bar .btn:first-child {
            --btn-bg: #D0D9E0;
            color: #22384B;
        }
        .nav-bar .btn:first-child:hover {
            background: #BEC8D2;
        }
        .nav-bar .btn:nth-child(2) {
            --btn-bg: #E8EDF2;
            color: #22384B;
        }
        .nav-bar .btn:nth-child(2):hover {
            background: #D0D9E0;
        }
        .nav-bar .btn:last-child {
            --btn-bg: #2C5A7A;
            color: white;
        }
        .nav-bar .btn:last-child:disabled {
            --btn-bg: #D0D9E0;
            color: #7A8A9A;
        }
        .nav-bar .btn:last-child:not(:disabled):hover {
            background: #1F4660;
        }

        .nav-bar .btn-center-placeholder {
            flex: 1;
            min-width: 80px;
            visibility: hidden;
        }

        /* ===== СТРАНИЦА "О СЕБЕ" ===== */
        .about-container {
            text-align: center;
            padding: 10px 0 6px;
        }
        .about-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #2C5A7A;
            box-shadow: 0 4px 12px rgba(44, 90, 122, 0.2);
            margin-bottom: 16px;
        }
        .about-text {
            font-size: 15px;
            line-height: 1.7;
            color: #3A5A72;
            max-width: 480px;
            margin: 0 auto 12px;
            white-space: pre-line;
            text-align: left;
            padding: 0 8px;
        }
        .about-text:last-of-type {
            margin-top: 16px;
            margin-bottom: 0;
        }
        .about-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin: 16px 0 16px;
        }
        .about-link {
            background: #E8EDF2;
            padding: 10px 22px;
            border-radius: 40px;
            text-decoration: none;
            color: #22384B;
            font-weight: 500;
            font-size: 16px;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid transparent;
            -webkit-tap-highlight-color: transparent;
        }
        .about-link:hover {
            background: #D0D9E0;
            border-color: #2C5A7A;
        }
        .about-link i {
            font-size: 20px;
        }
        .about-restart-btn {
            --btn-bg: #2C5A7A;
            background: var(--btn-bg);
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 40px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
            display: inline-block;
        }
        .about-restart-btn:active {
            transform: scale(0.96);
        }
        .about-restart-btn:focus, .about-restart-btn:focus-visible {
            background: var(--btn-bg);
            outline: none;
        }
        .about-restart-btn:hover {
            background: #1F4660;
        }

        /* Контейнер для двух кнопок на последней странице */
        .about-buttons {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 18px;
            flex-wrap: wrap;
        }
        .about-buttons .about-restart-btn {
            flex: 1;
            min-width: 120px;
        }
        .about-buttons .about-restart-btn:last-child {
            background: #6A8CA8; /* чуть светлее для второй кнопки */
        }
        .about-buttons .about-restart-btn:last-child:hover {
            background: #5A7A92;
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 500px) {
            .container { padding: 16px 12px; }
            .card-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .grid-3x4 { gap: 6px; }
            .grid-cell { font-size: 13px; padding: 10px 4px; min-height: 50px; }
            .test-options { grid-template-columns: 1fr 1fr; gap: 8px; }
            .select-options { grid-template-columns: 1fr 1fr; gap: 8px; }
            .btn { font-size: 15px; padding: 10px 18px; min-width: 70px; }
            .nav-bar .btn { font-size: 13px; padding: 8px 6px; }
            .about-avatar { width: 100px; height: 100px; }
            .about-text { font-size: 14px; }
            .about-link { font-size: 14px; padding: 8px 16px; }
            .about-buttons .about-restart-btn { min-width: 100px; font-size: 15px; padding: 10px 12px; }
        }
    </style>
</head>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
    </script>

    <div class="container" id="app">
        <h1 id="mainTitle"></h1>
        <div class="subtitle" id="mainSubtitle"></div>

        <!-- индикатор шагов (6 шагов) -->
        <div class="step-indicator" id="stepDots">
            <div class="step-dot active" data-step="0"></div>
            <div class="step-dot" data-step="1"></div>
            <div class="step-dot" data-step="2"></div>
            <div class="step-dot" data-step="3"></div>
            <div class="step-dot" data-step="4"></div>
            <div class="step-dot" data-step="5"></div>
        </div>

        <!-- ======== СТРАНИЦА 0: ЗАПОМНИ ======== -->
        <div class="page active" data-page="0">
            <p id="step0Desc" style="text-align:center; color:#5A7A92; margin-bottom:6px;"></p>
            <div class="card-grid" id="memoryGrid"></div>
            <div style="text-align:center;">
                <button class="btn-remember" id="btnRemembered"></button>
            </div>
            <div class="nav-bar">
                <button class="btn" disabled id="navBack0"></button>
                <span class="btn-center-placeholder"></span>
                <button class="btn" id="nextFromPage0" disabled onclick="goToPage(1)"></button>
            </div>
        </div>

        <!-- ======== СТРАНИЦА 1: ПОМНЮ / НЕ ПОМНЮ ======== -->
        <div class="page" data-page="1">
            <div class="progress-row">
                <span class="progress-text" id="memProgressText">외움: 0 / 6</span>
                <span class="progress-text" id="memRemainText">남음: 6</span>
            </div>
            <div id="memoryCard" class="card-memory"></div>
            <div class="memory-buttons" id="memoryButtons">
                <button class="btn btn-danger" id="btnForget"></button>
                <button class="btn btn-success" id="btnRemember"></button>
            </div>
            <div class="nav-bar">
                <button class="btn" onclick="goToPage(0)" id="navBack1"></button>
                <button class="btn" onclick="resetMemory()" id="navRepeat1"></button>
                <button class="btn" id="nextFromMemory" disabled onclick="goToPage(2)"></button>
            </div>
        </div>

        <!-- ======== СТРАНИЦА 2: ВЫБЕРИ КОРЕЙСКИЙ ======== -->
        <div class="page" data-page="2">
            <p id="step2Desc" style="text-align:center; color:#5A7A92; margin-bottom:6px;"></p>
            <div class="progress-row">
                <span class="progress-text" id="selectProgressText">답변 완료: 0 / 6</span>
            </div>
            <div id="selectContainer"></div>
            <div class="nav-bar">
                <button class="btn" onclick="goToPage(1)" id="navBack2"></button>
                <button class="btn" onclick="resetSelect()" id="navRepeat2"></button>
                <button class="btn" id="nextFromSelect" disabled onclick="goToPage(3)"></button>
            </div>
        </div>

        <!-- ======== СТРАНИЦА 3: ТАБЛИЦА 3×4 ======== -->
        <div class="page" data-page="3">
            <p id="step3Desc" style="text-align:center; color:#5A7A92; margin-bottom:6px;"></p>
            <div class="progress-row">
                <span class="progress-text" id="gridProgressText">찾은 짝: 0 / 6</span>
            </div>
            <div id="gridContainer">
                <div class="grid-3x4" id="gridTable"></div>
            </div>
            <div class="nav-bar">
                <button class="btn" onclick="goToPage(2)" id="navBack3"></button>
                <button class="btn" onclick="resetGrid()" id="navRepeat3"></button>
                <button class="btn" id="nextFromGrid" disabled onclick="goToPage(4)"></button>
            </div>
        </div>

        <!-- ======== СТРАНИЦА 4: ТЕСТ (русский перевод) ======== -->
        <div class="page" data-page="4">
            <p id="step4Desc" style="text-align:center; color:#5A7A92; margin-bottom:6px;"></p>
            <div class="progress-row">
                <span class="progress-text" id="testProgressText">답변 완료: 0 / 6</span>
            </div>
            <div id="testContainer"></div>
            <div class="nav-bar">
                <button class="btn" onclick="goToPage(3)" id="navBack4"></button>
                <button class="btn" onclick="resetTest()" id="navRepeat4"></button>
                <button class="btn" id="nextFromTest" disabled onclick="finishLesson()"></button>
            </div>
        </div>

        <!-- ======== СТРАНИЦА 5: О СЕБЕ ======== -->
        <div class="page" data-page="5">
            <div class="about-container">
                <img class="about-avatar" 
                     src="https://i.ibb.co/k2qvPMzw/IMG-6694.jpg" 
                     alt="Pinkmoon">
                <div class="about-text">
    안녕하세요! 핑크문 러시아어입니다! 🌙

    이 수업이 러시아어 공부에 조금이나마 도움이 되었길 바랍니다!

    더 많은 유용한 자료는 제 SNS에서 찾을 수 있어요:
    • 유튜브: 러시아 문화, 러시아 생활, 러시아어 수업
    • 텔레그램: 무료 PDF과 인터랙티브 HTML 수업
                </div>
                <div class="about-links">
                    <a class="about-link" href="https://youtube.com/@russian_pinkmoon" target="_blank">
                        <span>📺</span> YouTube
                    </a>
                    <a class="about-link" href="https://t.me/russian_pinkmoon" target="_blank">
                        <span>💬</span> Telegram
                    </a>
                </div>
                <div class="about-text">
    러시아어 공부가 쉽고 즐겁기를 바랍니다! 파이팅! 💪
                </div>

                <!-- ДВЕ КНОПКИ: обновить и на главную -->
                <div class="about-buttons">
                    <button class="about-restart-btn" onclick="location.reload()">🔄 다시 시작</button>
                    <button class="about-restart-btn" onclick="window.location.href='index.html'">📚 레슨 목록으로</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        //  ПЕРЕВОД ИНТЕРФЕЙСА НА КОРЕЙСКИЙ
        // ============================================================
        const uiText = {
            title: "📖 책 관련 어휘",
            subtitle: "수업 제공: 핑크문 러시아어",
            step0_title: "한 번 외워 보세요!",
            step0_rememberBtn: "✅ 기억했어요!",
            step0_rememberDone: "🎉 완료!",
            step1_progress: "외움:",
            step1_remain: "남음:",
            step1_allDone: "🎉 모든 단어를 외웠어요!",
            step1_hint: "👆 눌러서 번역 보기",
            step1_btnForget: "❌ 기억 안 나요",
            step1_btnRemember: "✅ 기억나요",
            step2_title: "한국어 번역을 선택하세요",
            step2_progress: "답변 완료:",
            step2_allDone: "🎉 좋아요!",
            step3_title: "그리드에서 짝을 찾으세요",
            step3_progress: "찾은 짝:",
            step3_allDone: "🎉 짝을 모두 찾았어요!",
            step4_title: "러시아어 번역을 선택하세요",
            step4_progress: "답변 완료:",
            step4_allDone: "🎉 훌륭해요!\n모든 문제를 맞췄어요.",
            nav_back: "⬅️ 이전",
            nav_repeat: "🔄 다시 하기",
            nav_next: "다음 ➡️",
            nav_finish: "🎉 완료"
        };

        // ============================================================
        //  ДАННЫЕ (слова для изучения) – обновлённые картинки
        // ============================================================
        const words = [
            { ru: "Откры́ть кни́гу", ko: "책을 펴다", img: "https://i.ibb.co/wFbpbghB/IMG-7035.jpg" },
            { ru: "Чита́ть кни́гу", ko: "책을 읽다", img: "https://i.ibb.co/99QgVH9d/IMG-7036.jpg" },
            { ru: "Дочита́ть кни́гу", ko: "책을 다 읽다", img: "https://i.ibb.co/pczKrkz/IMG-7037.jpg" },
            { ru: "Закры́ть кни́гу", ko: "책을 덮다", img: "https://i.ibb.co/1f0TYxMH/IMG-7042.jpg" },
            { ru: "Рекомендова́ть кни́гу", ko: "책을 추천하다", img: "https://i.ibb.co/gLJmRtd8/IMG-7044.jpg" },
            { ru: "Дать почита́ть кни́гу", ko: "책을 빌려주다", img: "https://i.ibb.co/p6WpZJHq/IMG-7045.jpg" }
        ];

        // ------------------------------------------------------------
        //  СОСТОЯНИЕ
        // ------------------------------------------------------------
        let currentPage = 0;
        const totalPages = 6;

        let memoryPool = [];
        let remembered = new Set();

        let selectQueue = [];
        let selectAnswered = 0;
        let selectLocked = false;

        let selectedGrid = null;
        let gridTimer = null;
        let gridComplete = false;

        let testQueue = [];
        let testAnswered = 0;
        let testLocked = false;

        // ------------------------------------------------------------
        //  ИНИЦИАЛИЗАЦИЯ
        // ------------------------------------------------------------
        function init() {
            document.getElementById('mainTitle').textContent = uiText.title;
            document.getElementById('mainSubtitle').textContent = uiText.subtitle;

            document.getElementById('step0Desc').textContent = uiText.step0_title;
            document.getElementById('btnRemembered').textContent = uiText.step0_rememberBtn;

            document.getElementById('btnForget').textContent = uiText.step1_btnForget;
            document.getElementById('btnRemember').textContent = uiText.step1_btnRemember;

            document.getElementById('step2Desc').textContent = uiText.step2_title;
            document.getElementById('step3Desc').textContent = uiText.step3_title;
            document.getElementById('step4Desc').textContent = uiText.step4_title;

            document.querySelectorAll('[id^="navBack"]').forEach(el => el.textContent = uiText.nav_back);
            document.querySelectorAll('[id^="navRepeat"]').forEach(el => el.textContent = uiText.nav_repeat);
            document.querySelectorAll('[id^="nextFrom"]').forEach(el => el.textContent = uiText.nav_next);
            document.getElementById('nextFromTest').textContent = uiText.nav_finish;

            renderMemoryGrid();
            initMemory();
            initSelect();
            initGrid();
            initTest();
            updateDots();

            document.getElementById('btnRemembered').addEventListener('click', function() {
                this.disabled = true;
                this.textContent = uiText.step0_rememberDone;
                document.getElementById('nextFromPage0').disabled = false;
                this.blur();
            });
        }

        // ------------------------------------------------------------
        //  СТРАНИЦА 0
        // ------------------------------------------------------------
        function renderMemoryGrid() {
            const grid = document.getElementById('memoryGrid');
            grid.innerHTML = '';
            words.forEach((w) => {
                const div = document.createElement('div');
                div.className = 'card';
                div.innerHTML = `
                    <div class="card-img"><img src="${w.img}" alt="${w.ru}" loading="lazy"></div>
                    <div class="card-ru">${w.ru}</div>
                    <div class="card-ko">${w.ko}</div>
                `;
                grid.appendChild(div);
            });
        }

        // ------------------------------------------------------------
        //  СТРАНИЦА 1 (карточки)
        // ------------------------------------------------------------
        function initMemory() {
            memoryPool = words.map((w, idx) => ({ word: w, id: idx }));
            remembered = new Set();
            shuffle(memoryPool);
            updateMemoryUI();
            document.getElementById('nextFromMemory').disabled = true;
            document.getElementById('memoryButtons').classList.remove('hidden');
        }

        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function updateMemoryUI() {
            const remain = memoryPool.filter(item => !remembered.has(item.id));
            const done = remembered.size;
            document.getElementById('memProgressText').textContent = `${uiText.step1_progress} ${done} / 6`;
            document.getElementById('memRemainText').textContent = `${uiText.step1_remain} ${remain.length}`;

            const container = document.getElementById('memoryCard');
            const buttons = document.getElementById('memoryButtons');
            if (remain.length === 0) {
                container.innerHTML = `<div style="padding:20px; font-size:20px; color:#2C5A7A;">${uiText.step1_allDone}</div>`;
                container.classList.add('finished');
                document.getElementById('nextFromMemory').disabled = false;
                buttons.classList.add('hidden');
                document.activeElement?.blur();
                return;
            }
            container.classList.remove('finished');
            buttons.classList.remove('hidden');
            const next = remain[0];
            const w = next.word;
            container.innerHTML = `
                <div class="card-img"><img src="${w.img}" alt="${w.ru}" style="max-width:180px; max-height:180px; object-fit:cover; border-radius:16px;"></div>
                <div style="font-size:22px; font-weight:600; color:#22384B;">${w.ko}</div>
                <div class="memory-ru" id="memoryRu">${w.ru}</div>
                <div class="hint">${uiText.step1_hint}</div>
            `;
            container.dataset.currentId = next.id;
            const ruBlock = document.getElementById('memoryRu');
            if (ruBlock) ruBlock.classList.remove('show');

            container.onclick = function(e) {
                if (e.target.tagName === 'BUTTON') return;
                const ru = document.getElementById('memoryRu');
                if (ru) ru.classList.toggle('show');
            };

            document.getElementById('nextFromMemory').disabled = true;
            document.activeElement?.blur();
        }

        document.getElementById('btnRemember').addEventListener('click', function() {
            const container = document.getElementById('memoryCard');
            const id = parseInt(container.dataset.currentId);
            if (isNaN(id)) return;
            remembered.add(id);
            updateMemoryUI();
            this.blur();
        });

        document.getElementById('btnForget').addEventListener('click', function() {
            const container = document.getElementById('memoryCard');
            const id = parseInt(container.dataset.currentId);
            if (isNaN(id)) return;
            const index = memoryPool.findIndex(item => item.id === id);
            if (index !== -1) {
                const [item] = memoryPool.splice(index, 1);
                memoryPool.push(item);
            }
            updateMemoryUI();
            this.blur();
        });

        function resetMemory() {
            initMemory();
            goToPage(1);
        }

        // ------------------------------------------------------------
        //  СТРАНИЦА 2 (ВЫБЕРИ КОРЕЙСКИЙ)
        // ------------------------------------------------------------
        function initSelect() {
            selectQueue = words.map((w, idx) => ({ word: w, id: idx }));
            shuffle(selectQueue);
            selectAnswered = 0;
            selectLocked = false;
            document.getElementById('selectProgressText').textContent = `${uiText.step2_progress} 0 / 6`;
            document.getElementById('nextFromSelect').disabled = true;
            renderSelectQuestion();
        }

        function renderSelectQuestion() {
            const container = document.getElementById('selectContainer');
            if (selectQueue.length === 0) {
                container.innerHTML = `
                    <div style="padding:30px; text-align:center; font-size:24px; color:#2C5A7A;">
                        ${uiText.step2_allDone}
                    </div>
                `;
                document.getElementById('nextFromSelect').disabled = false;
                document.activeElement?.blur();
                return;
            }
            const item = selectQueue[0];
            const w = item.word;
            const others = words.filter((_, idx) => idx !== item.id);
            shuffle(others);
            const options = [w.ko, ...others.slice(0, 3).map(o => o.ko)];
            shuffle(options);

            container.innerHTML = `
                <div class="select-card">
                    <div style="font-size:24px; font-weight:600; color:#22384B; margin-bottom:10px;">${w.ru}</div>
                    <div class="select-options" id="selectOptions">
                        ${options.map((opt, idx) => `
                            <button class="select-opt" data-optidx="${idx}" data-correct="${opt === w.ko ? 'true' : 'false'}">${opt}</button>
                        `).join('')}
                    </div>
                </div>
            `;
            document.activeElement?.blur();

            document.querySelectorAll('#selectOptions .select-opt').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    if (selectLocked) return;
                    const isCorrect = this.dataset.correct === 'true';
                    selectLocked = true;
                    document.querySelectorAll('#selectOptions .select-opt').forEach(b => b.disabled = true);
                    if (isCorrect) {
                        this.classList.add('correct');
                        selectAnswered++;
                        document.getElementById('selectProgressText').textContent = `${uiText.step2_progress} ${selectAnswered} / 6`;
                        selectQueue.shift();
                        this.blur();
                        setTimeout(() => {
                            selectLocked = false;
                            renderSelectQuestion();
                        }, 500);
                    } else {
                        this.classList.add('wrong');
                        document.querySelector('#selectOptions .select-opt[data-correct="true"]').classList.add('correct');
                        const [first] = selectQueue.splice(0, 1);
                        selectQueue.push(first);
                        this.blur();
                        setTimeout(() => {
                            selectLocked = false;
                            renderSelectQuestion();
                        }, 800);
                    }
                });
            });
        }

        function resetSelect() {
            initSelect();
            goToPage(2);
        }

        // ------------------------------------------------------------
        //  СТРАНИЦА 3 (ТАБЛИЦА 3×4)
        // ------------------------------------------------------------
        function initGrid() {
            gridComplete = false;
            const items = [];
            words.forEach((w, idx) => {
                items.push({ text: w.ru, id: idx, type: 'ru' });
                items.push({ text: w.ko, id: idx, type: 'ko' });
            });
            shuffle(items);
            selectedGrid = null;
            renderGrid(items);
            document.getElementById('gridProgressText').textContent = `${uiText.step3_progress} 0 / 6`;
            document.getElementById('nextFromGrid').disabled = true;
            if (gridTimer) clearTimeout(gridTimer);
            gridTimer = null;
            const container = document.getElementById('gridContainer');
            container.innerHTML = `<div class="grid-3x4" id="gridTable"></div>`;
            renderGrid(items);
        }

        function renderGrid(items) {
            const grid = document.getElementById('gridTable');
            if (!grid) return;
            grid.innerHTML = '';
            items.forEach((item) => {
                const cell = document.createElement('div');
                cell.className = 'grid-cell';
                cell.textContent = item.text;
                cell.dataset.id = item.id;
                cell.dataset.type = item.type;
                cell.addEventListener('click', () => handleGridClick(cell));
                grid.appendChild(cell);
            });
        }

        let gridSelectedEl = null;
        function handleGridClick(el) {
            if (el.classList.contains('matched')) return;
            if (gridSelectedEl && gridSelectedEl !== el) {
                const id1 = parseInt(gridSelectedEl.dataset.id);
                const id2 = parseInt(el.dataset.id);
                if (id1 === id2 && gridSelectedEl.dataset.type !== el.dataset.type) {
                    gridSelectedEl.classList.add('matched');
                    el.classList.add('matched');
                    gridSelectedEl.classList.remove('selected');
                    el.classList.remove('selected');
                    gridSelectedEl = null;
                    updateGridProgress();
                    const matched = document.querySelectorAll('#gridTable .grid-cell.matched').length;
                    if (matched === words.length * 2) {
                        document.getElementById('nextFromGrid').disabled = false;
                        showGridComplete();
                    }
                } else {
                    gridSelectedEl.classList.add('wrong');
                    el.classList.add('wrong');
                    gridSelectedEl.classList.remove('selected');
                    if (gridTimer) clearTimeout(gridTimer);
                    gridTimer = setTimeout(() => {
                        gridSelectedEl.classList.remove('wrong');
                        el.classList.remove('wrong');
                        gridSelectedEl = null;
                        gridTimer = null;
                    }, 400);
                }
                return;
            }
            if (gridSelectedEl === el) {
                el.classList.remove('selected');
                gridSelectedEl = null;
                return;
            }
            el.classList.add('selected');
            gridSelectedEl = el;
        }

        function updateGridProgress() {
            const matched = document.querySelectorAll('#gridTable .grid-cell.matched').length;
            const count = matched / 2;
            document.getElementById('gridProgressText').textContent = `${uiText.step3_progress} ${count} / 6`;
        }

        function showGridComplete() {
            const container = document.getElementById('gridContainer');
            container.innerHTML = `
                <div style="padding:30px; text-align:center; font-size:24px; color:#2C5A7A;">
                    ${uiText.step3_allDone}
                </div>
            `;
        }

        function resetGrid() {
            initGrid();
            goToPage(3);
        }

        // ------------------------------------------------------------
        //  СТРАНИЦА 4 (ТЕСТ – русский перевод)
        // ------------------------------------------------------------
        function initTest() {
            testQueue = words.map((w, idx) => ({ word: w, id: idx }));
            shuffle(testQueue);
            testAnswered = 0;
            testLocked = false;
            document.getElementById('testProgressText').textContent = `${uiText.step4_progress} 0 / 6`;
            document.getElementById('nextFromTest').disabled = true;
            renderTestQuestion();
        }

        function renderTestQuestion() {
            const container = document.getElementById('testContainer');
            if (testQueue.length === 0) {
                const lines = uiText.step4_allDone.split('\n');
                container.innerHTML = `
                    <div style="padding:30px; text-align:center; font-size:20px; color:#2C5A7A;">
                        <div>${lines[0]}</div>
                        <div>${lines[1] || ''}</div>
                    </div>
                `;
                document.getElementById('nextFromTest').disabled = false;
                document.activeElement?.blur();
                return;
            }
            const item = testQueue[0];
            const w = item.word;
            const others = words.filter((_, idx) => idx !== item.id);
            shuffle(others);
            const options = [w.ru, ...others.slice(0, 3).map(o => o.ru)];
            shuffle(options);

            container.innerHTML = `
                <div class="test-card">
                    <div class="card-img"><img src="${w.img}" alt="${w.ru}" style="max-width:150px; max-height:150px; object-fit:cover; border-radius:16px;"></div>
                    <div style="font-size:24px; font-weight:600; color:#22384B; margin-top:6px;">${w.ko}</div>
                    <div class="test-options" id="testOptions">
                        ${options.map((opt, idx) => `
                            <button class="test-opt" data-optidx="${idx}" data-correct="${opt === w.ru ? 'true' : 'false'}">${opt}</button>
                        `).join('')}
                    </div>
                </div>
            `;
            document.activeElement?.blur();

            document.querySelectorAll('#testOptions .test-opt').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    if (testLocked) return;
                    const isCorrect = this.dataset.correct === 'true';
                    testLocked = true;
                    document.querySelectorAll('#testOptions .test-opt').forEach(b => b.disabled = true);
                    if (isCorrect) {
                        this.classList.add('correct');
                        testAnswered++;
                        document.getElementById('testProgressText').textContent = `${uiText.step4_progress} ${testAnswered} / 6`;
                        testQueue.shift();
                        this.blur();
                        setTimeout(() => {
                            testLocked = false;
                            renderTestQuestion();
                        }, 500);
                    } else {
                        this.classList.add('wrong');
                        document.querySelector('#testOptions .test-opt[data-correct="true"]').classList.add('correct');
                        const [first] = testQueue.splice(0, 1);
                        testQueue.push(first);
                        this.blur();
                        setTimeout(() => {
                            testLocked = false;
                            renderTestQuestion();
                        }, 800);
                    }
                });
            });
        }

        function resetTest() {
            initTest();
            goToPage(4);
        }

        // ------------------------------------------------------------
        //  НАВИГАЦИЯ
        // ------------------------------------------------------------
        function goToPage(num) {
            if (num < 0 || num >= totalPages) return;
            if (num > currentPage) {
                const nextBtn = document.querySelector(`.page[data-page="${currentPage}"] .nav-bar .btn:last-child`);
                if (nextBtn && nextBtn.disabled) return;
            }
            document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
            document.querySelector(`.page[data-page="${num}"]`).classList.add('active');
            currentPage = num;
            updateDots();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            document.activeElement?.blur();
        }

        function updateDots() {
            document.querySelectorAll('.step-dot').forEach((dot, idx) => {
                dot.classList.remove('active', 'done');
                if (idx === currentPage) dot.classList.add('active');
                else if (idx < currentPage) dot.classList.add('done');
            });
        }

        function finishLesson() {
            if (testAnswered === words.length) {
                goToPage(5);
            }
        }

        // ------------------------------------------------------------
        //  ЗАПУСК
        // ------------------------------------------------------------
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
