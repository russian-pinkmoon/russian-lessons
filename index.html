<!DOCTYPE html>
<html lang="ko">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>러시아어 어휘 배우기</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #E8EDF2;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            -webkit-tap-highlight-color: transparent;
        }
        .container {
            max-width: 700px;
            width: 100%;
            background: #FFFFFF;
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(34, 56, 75, 0.10);
            padding: 24px 20px 32px;
            text-align: center;
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #22384B;
            margin-bottom: 6px;
            letter-spacing: 0.3px;
        }
        .sub {
            font-size: 16px;
            color: #5A7A92;
            margin-bottom: 28px;
            border-bottom: 2px solid #D0D9E0;
            padding-bottom: 16px;
        }

        /* Сетка для двух колонок */
        .lessons-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 8px;
        }

        .lesson-card {
            display: block;
            background: #FFFFFF;
            border: 2px solid #D0D9E0;
            border-radius: 24px;
            padding: 12px 12px 10px;  /* чуть меньше padding, чтобы картинка была больше */
            text-decoration: none;
            color: inherit;
            transition: box-shadow 0.25s, transform 0.15s;
            /* убираем max-width и margin, чтобы карточка занимала всю ширину колонки */
        }
        .lesson-card:hover {
            box-shadow: 0 8px 24px rgba(34, 56, 75, 0.12);
            transform: translateY(-2px);
        }
        .lesson-card:active {
            transform: scale(0.98);
        }

        .lesson-card img {
            width: 100%;
            height: auto;
            display: block;
            /* border-radius убран */
        }

        .lesson-title {
            margin-top: 8px;  /* чуть меньше отступ сверху */
            font-size: 20px;
            font-weight: 600;
            color: #22384B;
            letter-spacing: 0.2px;
        }

        @media (max-width: 500px) {
            .container { padding: 20px 16px; }
            h1 { font-size: 24px; }
            .lesson-title { font-size: 18px; }  /* оставлено как было */
            /* на маленьких экранах можно чуть уменьшить gap и padding карточек */
            .lessons-grid {
                gap: 10px;
            }
            .lesson-card {
                padding: 10px 10px 8px;
            }
        }
        /* Для очень узких экранов (менее 350px) можно оставить две колонки,
           но если будет слишком тесно – можно переключить на одну, 
           однако по требованию оставляем две везде */
        @media (max-width: 350px) {
            .lessons-grid {
                gap: 8px;
            }
            .lesson-card {
                padding: 8px;
            }
            .lesson-title {
                font-size: 16px; /* чуть меньше, но можно и оставить 18 */
            }
        }
    </style>
</head>
<body>
    <!-- Инициализация Telegram Mini App -->
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
    </script>

    <div class="container">
        <h1>러시아어 어휘 배우기</h1>
        <div class="sub">클릭해서 수업을 시작하세요</div>

        <!-- Сетка с двумя карточками -->
        <div class="lessons-grid">
            <!-- Первый урок (Книги) -->
            <a href="lesson-books.html" class="lesson-card">
                <img 
                    src="https://i.ibb.co/F4KBp99k/2026-08-18-22-56-50.png" 
                    alt="Превью урока 'Книги'"
                    loading="lazy"
                >
                <div class="lesson-title">📖 책 관련 어휘</div>
            </a>

            <!-- Второй урок (Телефон) -->
            <a href="lesson-phone.html" class="lesson-card">
                <img 
                    src="https://i.ibb.co/pBBmsPhZ/image.png" 
                    alt="Превью урока 'Телефон'"
                    loading="lazy"
                >
                <div class="lesson-title">📱 핸드폰 관련 어휘</div>
            </a>
        </div>
    </div>
</body>
</html>
