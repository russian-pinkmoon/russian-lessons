<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Roboto,system-ui,sans-serif;background:#E8EDF2;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:8px;-webkit-tap-highlight-color:transparent}

.lesson-card{display:block;background:#fff;border:2px solid #D0D9E0;border-radius:14px;padding:0;text-decoration:none;color:inherit;transition:box-shadow .25s,transform .15s;overflow:hidden}
.lesson-card:hover{box-shadow:0 8px 24px rgba(34,56,75,.12);transform:translateY(-2px)}
.lesson-card:active{transform:scale(.98)}
.lesson-card img{width:100%;height:auto;display:block}
.lesson-title{padding:8px 10px 10px;font-size:20px;font-weight:600;color:#22384B;letter-spacing:.2px;background:#fff;text-align:center}
@media(max-width:500px){body{padding:6px}h1{font-size:24px}.lesson-title{font-size:18px}.lessons-grid{gap:4px}}
@media(max-width:350px){.lessons-grid{gap:3px}.lesson-title{font-size:16px;padding:6px 8px 8px}}
</style>
</head>
